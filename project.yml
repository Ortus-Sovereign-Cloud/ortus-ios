# The Xcode project is made from this file (XcodeGen): `xcodegen generate`.
name: Ortus
options:
  bundleIdPrefix: cc.ortus
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
packages:
  OrtusKit:
    path: OrtusKit
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Signed ad hoc (no developer account): the simulator's Keychain needs a
    # signed app. Store builds are signed by the owner (OWNER-NEEDED.md).
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_REQUIRED: "NO"
targets:
  Ortus:
    type: application
    platform: iOS
    sources:
      - path: Ortus
    dependencies:
      - package: OrtusKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.ortus.app
        # iPhone only (portrait); on an iPad it runs as the iPhone app.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Store builds (ci/release.yml): signed by the team, the
        # certificate and profile made by Xcode with the API key.
        Release:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
          CODE_SIGNING_REQUIRED: "YES"
          DEVELOPMENT_TEAM: XD7JHZ5DB3
    info:
      path: Ortus/Info.plist
      properties:
        CFBundleDisplayName: Ortus
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, pl, uk, de, fr, ar]
        UILaunchScreen: {}
        # Only the system's own encryption (HTTPS, the Secure Enclave).
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSFaceIDUsageDescription: Face ID guards the key this phone keeps for you.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  OrtusUITests:
    type: bundle.ui-testing
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
    sources:
      - path: OrtusUITests
    dependencies:
      - target: Ortus
schemes:
  Ortus:
    build:
      targets:
        Ortus: all
        OrtusUITests: [test]
    test:
      targets:
        - OrtusUITests
