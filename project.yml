# The Xcode project is made from this file (XcodeGen): `xcodegen generate`.
name: Ortus
options:
  bundleIdPrefix: cc.ortus
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
packages:
  OrtusKit:
    path: OrtusKit
  # Google's WebRTC for native calls (BSD-3-Clause, the owner's exception).
  WebRTC:
    path: WebRTC
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Signed ad hoc (no developer account): the simulator's Keychain needs a
    # signed app. Store builds are signed by the owner (OWNER-NEEDED.md).
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_REQUIRED: "NO"
targets:
  Ortus:
    type: application
    platform: iOS
    sources:
      - path: Ortus
      - path: Shared
    dependencies:
      - package: OrtusKit
      - package: WebRTC
      - target: OrtusNotifications
      # End-to-end rooms (static, linked in; not embedded).
      - target: OrtusE2E
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.ortus.app
        # iPhone only (portrait); on an iPad it runs as the iPhone app.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Store builds (ci/release.yml): signed by the team, the
        # certificate and profile made by Xcode with the API key.
        Release:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
          CODE_SIGNING_REQUIRED: "YES"
          DEVELOPMENT_TEAM: XD7JHZ5DB3
          # Invitation links on ortus.cc open the app (universal links).
          CODE_SIGN_ENTITLEMENTS: Ortus.entitlements
    info:
      path: Ortus/Info.plist
      properties:
        CFBundleDisplayName: Ortus
        # From the build settings (XcodeGen would write 1.0 and 1).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, pl, uk, de, fr, ar, es, it]
        UILaunchScreen: {}
        # Exempt encryption only: the system's HTTPS and, for end-to-end
        # rooms, Olm and Megolm (AES, Curve25519, Ed25519): standard
        # algorithms, mass market (EAR 5D992.c, self-classification report).
        # App Store Connect's encryption questions (26 November 2026): no
        # documents needed, so NO here (store/ios/README.md).
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSFaceIDUsageDescription: Face ID guards the key this phone keeps for you.
        NSCameraUsageDescription: The camera reads sign-in codes and shows you in calls.
        NSMicrophoneUsageDescription: The microphone lets others hear you in calls.
        # A call goes on when you switch to another app.
        UIBackgroundModes: [audio, voip]
        # ortus://join?server=…&code=…, which an invitation page offers on a phone.
        CFBundleURLTypes:
          - CFBundleURLName: cc.ortus.app.join
            CFBundleURLSchemes: [ortus]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  OrtusNotifications:
    type: app-extension
    platform: iOS
    sources:
      - path: OrtusNotifications
      - path: Shared
    dependencies:
      - package: OrtusKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.ortus.app.notifications
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Release:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
          CODE_SIGNING_REQUIRED: "YES"
          DEVELOPMENT_TEAM: XD7JHZ5DB3
          CODE_SIGN_ENTITLEMENTS: OrtusNotifications.entitlements
    info:
      path: OrtusNotifications/Info.plist
      properties:
        CFBundleDisplayName: Ortus
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
  # The end-to-end library (ci/e2e-lib.sh builds .deps/e2e: Rust from the
  # chat commit the pinned program builds on) with its Swift bindings, as a
  # module of its own.
  OrtusE2E:
    type: framework
    platform: iOS
    sources:
      - path: .deps/e2e/swift
    dependencies:
      - framework: .deps/e2e/OrtusE2EFFI.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.ortus.e2e
        MACH_O_TYPE: staticlib
        GENERATE_INFOPLIST_FILE: "YES"
        SKIP_INSTALL: "YES"
        TARGETED_DEVICE_FAMILY: "1"
  OrtusUITests:
    type: bundle.ui-testing
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
    sources:
      - path: OrtusUITests
    dependencies:
      - target: Ortus
      # Another device of the same person, in the end-to-end test.
      - target: OrtusE2E
        embed: false
schemes:
  Ortus:
    build:
      targets:
        Ortus: all
        OrtusUITests: [test]
    test:
      targets:
        - OrtusUITests
