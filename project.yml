# The Xcode project is made from this file (XcodeGen): `xcodegen generate`.
name: Ortus
options:
  bundleIdPrefix: cc.ortus
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
packages:
  OrtusKit:
    path: OrtusKit
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
targets:
  Ortus:
    type: application
    platform: iOS
    sources:
      - path: Ortus
    dependencies:
      - package: OrtusKit
    info:
      path: Ortus/Info.plist
      properties:
        CFBundleDisplayName: Ortus
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, pl, uk, de, fr, ar]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSFaceIDUsageDescription: Face ID guards the key this phone keeps for you.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  OrtusUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: OrtusUITests
    dependencies:
      - target: Ortus
schemes:
  Ortus:
    build:
      targets:
        Ortus: all
        OrtusUITests: [test]
    test:
      targets:
        - OrtusUITests
