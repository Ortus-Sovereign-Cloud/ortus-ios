name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kit:
    # The shared code, on Linux (as the build machine runs it).
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - run: cd OrtusKit && swift test

  ios:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: The Ortus program at its pinned parts
        uses: actions/checkout@v4
        with:
          repository: Ortus-Sovereign-Cloud/ortus
          path: program
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            program/target
          key: ortus-macos-${{ hashFiles('program/pins.toml', 'program/Cargo.lock') }}
          restore-keys: ortus-macos-
      - name: Build Ortus
        run: |
          cd program
          ci/fetch.sh
          cargo build --release -p ortus
      - name: Start Ortus and invite Iryna
        run: ci/start-ortus.sh program/target/release/ortus
      - name: Tests in the simulator
        run: |
          brew install xcodegen
          xcodegen generate
          set -o pipefail
          # An iPhone simulator of the newest installed iOS (the runner's
          # set changes): the first available, or a new one.
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in d if "iOS" in k), key=lambda k: [int(x) for x in k.rsplit("iOS-", 1)[-1].split("-")])
          phones = [x["udid"] for k in reversed(ios) for x in d[k] if x["name"].startswith("iPhone")]
          print(phones[0] if phones else "")')
          if [ -z "$udid" ]; then
            runtime=$(xcrun simctl list runtimes available -j | python3 -c 'import json,sys; r=[x for x in json.load(sys.stdin)["runtimes"] if x["platform"]=="iOS"]; print(r[-1]["identifier"])')
            type=$(xcrun simctl list devicetypes -j | python3 -c 'import json,sys; t=[x for x in json.load(sys.stdin)["devicetypes"] if x["name"].startswith("iPhone")]; print(t[-1]["identifier"])')
            udid=$(xcrun simctl create ortus-test "$type" "$runtime")
          fi
          echo "simulator: $udid"
          # TEST_RUNNER_<name> in xcodebuild's environment reaches the
          # tests as <name>.
          TEST_RUNNER_CI=true TEST_RUNNER_ORTUS_SERVER="$ORTUS_SERVER" TEST_RUNNER_ORTUS_CODE="$ORTUS_CODE" TEST_RUNNER_ORTUS_ADMIN_CODE="$ORTUS_ADMIN_CODE" TEST_RUNNER_ORTUS_OWNER_TOTP="$ORTUS_OWNER_TOTP" \
            xcodebuild test -project Ortus.xcodeproj -scheme Ortus \
            -destination "id=$udid" \
            -resultBundlePath results.xcresult > xcodebuild.log 2>&1 || status=$?
          # Every test's result and every error, whatever the log's length.
          grep -E "error:|Test Case .*(passed|failed)|Executed|\*\* TEST" xcodebuild.log | cut -c1-20000
          exit "${status:-0}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: |
            results.xcresult
            xcodebuild.log
